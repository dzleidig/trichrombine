[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trichrom"
version = "0.1.0"
description = "Trichromatic (3-shot) RGB film scanning via Scanlight + Sony A7R V"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Dylan Leidig", email = "dzleidig@gmail.com"}
]

dependencies = [
    "numpy",
    "rawpy",
    "tifffile",
    "pyexiv2",
    "pyserial",
    "scipy",     # leader-density masking, flat-field smoothing
]

[project.scripts]
trichrom-scan = "trichrom.scan:main"

[project.optional-dependencies]
gphoto = [
    "gphoto2",   # only for --camera-backend gphoto2; the default drives Capture One
]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-data = {trichrom = []}
