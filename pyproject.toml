[build-system]
# 77 is the floor for PEP 639 (SPDX `license` string + `license-files`), used below.
# `wheel` is not listed: setuptools has vendored it since 70.1.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trichrom"
version = "0.1.0"
description = "Trichromatic (3-shot) RGB film scanning via Scanlight + Sony A7R V"
readme = "README.md"
# numpy, scipy and tifffile all floor at 3.11, so anything lower cannot resolve.
# Development and CI run 3.14 (see .tool-versions); 3.11 is the tested lower bound.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Dylan Leidig", email = "dzleidig@gmail.com"}
]

# Floors are set at the first release that ships official wheels for every Python
# this project supports, which is a correctness constraint rather than a taste one.
# With no floor, pip on 3.14 happily fell back to building numpy 2.2.1 from source —
# a release that predates 3.14 by a year — and the resulting numpy returned silently
# wrong answers from scipy.ndimage: measure_leader_level read 1008232 where it should
# read 1000. Nothing raised. That sets the exposure target for a whole roll, so it
# would have mis-exposed every frame rather than failing.
#
# Only the three that link numpy's C ABI need this; the rest are pure Python or do
# not touch numpy, so they carry no floor.
dependencies = [
    "numpy>=2.3.2",    # first numpy with cp314 wheels
    "scipy>=1.16.1",   # first scipy with cp314 wheels; leader masking, flat smoothing
    "rawpy>=0.26.0",   # first rawpy with cp314 wheels
    "tifffile",
    "pyexiv2",
    "pyserial",
]

[project.scripts]
trichrom-scan = "trichrom.scan:main"

[project.optional-dependencies]
gphoto = [
    "gphoto2",   # only for --camera-backend gphoto2; the default drives Capture One
]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-data = {trichrom = []}
