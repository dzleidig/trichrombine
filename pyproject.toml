[build-system]
# 77 is the floor for PEP 639 (SPDX `license` string + `license-files`), used below.
# `wheel` is not listed: setuptools has vendored it since 70.1.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trichrom"
version = "0.1.0"
description = "Trichromatic (3-shot) RGB film scanning via Scanlight + Sony A7R V"
readme = "README.md"
# numpy, scipy and tifffile all floor at 3.11, so anything lower cannot resolve.
# Development and CI run 3.14 (see .tool-versions); 3.11 is the tested lower bound.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Dylan Leidig", email = "dzleidig@gmail.com"}
]

dependencies = [
    "numpy",
    "rawpy",
    "tifffile",
    "pyexiv2",
    "pyserial",
    "scipy",     # leader-density masking, flat-field smoothing
]

[project.scripts]
trichrom-scan = "trichrom.scan:main"

[project.optional-dependencies]
gphoto = [
    "gphoto2",   # only for --camera-backend gphoto2; the default drives Capture One
]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-data = {trichrom = []}
